<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Browser · Go</title>
    <style>
        * {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        body {
            background: #f5f7fb;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .header {
            background: #1e2a3e;
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 500;
        }
        .view-toggle button {
            background: #334155;
            border: none;
            color: white;
            padding: 8px 16px;
            margin-left: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .view-toggle button.active {
            background: #3b82f6;
        }
        .breadcrumb {
            background: #f8fafc;
            padding: 12px 24px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
            word-break: break-all;
        }
        .breadcrumb a {
            color: #2563eb;
            text-decoration: none;
        }
        .file-list {
            padding: 20px;
        }
        /* List view */
        .list-view .item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #edf2f7;
        }
        .list-view .item-icon {
            width: 40px;
            font-size: 1.6rem;
            text-align: center;
        }
        .list-view .item-name {
            flex: 1;
            font-weight: 500;
        }
        .list-view .item-name a {
            text-decoration: none;
            color: #0f172a;
        }
        .list-view .item-size {
            color: #475569;
            font-size: 0.85rem;
            min-width: 80px;
            text-align: right;
        }
        /* Gallery view */
        .gallery-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .gallery-view .item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .gallery-view .item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .gallery-view .thumbnail {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            background: #e2e8f0;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .gallery-view .item-name {
            font-size: 0.85rem;
            word-break: break-word;
        }
        .gallery-view .item-name a {
            text-decoration: none;
            color: #1e293b;
        }
        .gallery-view .item-size {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 4px;
        }
        .empty {
            text-align: center;
            padding: 48px;
            color: #64748b;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 12px;
        }
        footer {
            padding: 16px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }
        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            user-select: none;
        }
        .lightbox.open { display: flex; }
        .lightbox-img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
            border-radius: 4px;
        }
        .lightbox-caption {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: #e2e8f0;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 999px;
            max-width: 80vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lightbox-caption a {
            color: #93c5fd;
            text-decoration: none;
            margin-left: 10px;
        }
        .lightbox-caption a:hover { text-decoration: underline; }
        .lightbox-btn {
            position: absolute;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .lightbox-btn:hover { background: rgba(255,255,255,0.25); }
        .lightbox-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }
        .lightbox-close { top: 20px; right: 20px; }
        .lightbox-prev { left: 20px; top: 50%; transform: translateY(-50%); }
        .lightbox-next { right: 20px; top: 50%; transform: translateY(-50%); }
        @media (max-width: 600px) {
            .lightbox-prev { left: 8px; }
            .lightbox-next { right: 8px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🖼️ Gallery Browser</h1>
        <div class="view-toggle">
            <button id="listViewBtn" class="active">📋 List</button>
            <button id="galleryViewBtn">🖼️ Gallery</button>
        </div>
    </div>
    <div class="breadcrumb" id="breadcrumb">Loading...</div>
    <div class="file-list list-view" id="fileList">
        <div class="empty">⏳ Loading...</div>
    </div>
    <footer>Click images to preview · use ⬇️ / "download" to save</footer>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
    <button class="lightbox-btn lightbox-close" id="lbClose" aria-label="Close (Esc)">✕</button>
    <button class="lightbox-btn lightbox-prev" id="lbPrev" aria-label="Previous (←)">‹</button>
    <button class="lightbox-btn lightbox-next" id="lbNext" aria-label="Next (→)">›</button>
    <img class="lightbox-img" id="lbImg" alt="">
    <div class="lightbox-caption" id="lbCaption"></div>
</div>

<script>
    let currentPath = decodeURIComponent(window.location.hash.substring(1) || '');
    let currentView = localStorage.getItem('galleryView') === 'gallery' ? 'gallery' : 'list';

    function setView(view) {
        currentView = view;
        localStorage.setItem('galleryView', view);
        document.getElementById('listViewBtn').classList.toggle('active', view === 'list');
        document.getElementById('galleryViewBtn').classList.toggle('active', view === 'gallery');
        const container = document.getElementById('fileList');
        container.classList.remove('list-view', 'gallery-view');
        container.classList.add(view === 'list' ? 'list-view' : 'gallery-view');
        if (window.lastContents) renderFileList(window.lastContents, window.lastCurrentDir);
    }

    async function fetchDirectory(path) {
        try {
            const params = new URLSearchParams({ dir: path });
            const resp = await fetch(`/api/list?${params}`);
            const data = await resp.json();
            if (data.error) throw new Error(data.error);
            window.lastContents = data.contents;
            window.lastCurrentDir = data.currentDir;
            renderFileList(data.contents, data.currentDir);
            renderBreadcrumb(data.currentDir, data.basePathForDisplay);
            window.location.hash = encodeURIComponent(path);
            currentPath = path;
        } catch (err) {
            showError(err.message);
        }
    }

    function renderFileList(contents, currentDir) {
        const container = document.getElementById('fileList');
        if (!contents.length) {
            container.innerHTML = '<div class="empty">📭 This folder is empty</div>';
            window.galleryImages = [];
            return;
        }

        // Build a flat list of images in display order so the lightbox can navigate.
        const images = contents
            .filter(it => it.type === 'file' && it.isImage)
            .map(it => ({
                name: it.name,
                path: it.path,
                viewUrl: `/api/download?file=${encodeURIComponent(it.path)}`,
                downloadUrl: `/api/download?file=${encodeURIComponent(it.path)}&download=1`,
            }));
        window.galleryImages = images;

        // Map a path back to its position in the images array.
        const imgIndex = new Map(images.map((img, i) => [img.path, i]));

        let html = '';
        if (currentDir !== '') {
            const parentPath = currentDir.substring(0, currentDir.lastIndexOf('/'));
            if (currentView === 'list') {
                html += `<div class="item"><div class="item-icon">📁</div><div class="item-name"><a href="#" class="folder-link" data-path="${escapeAttr(parentPath)}">..</a></div><div class="item-size">—</div></div>`;
            } else {
                html += `<div class="item"><div class="item-icon">📁</div><div class="item-name"><a href="#" class="folder-link" data-path="${escapeAttr(parentPath)}">..</a></div></div>`;
            }
        }

        for (const item of contents) {
            if (item.type === 'dir') {
                if (currentView === 'list') {
                    html += `<div class="item"><div class="item-icon">📁</div><div class="item-name"><a href="#" class="folder-link" data-path="${escapeAttr(item.path)}">${escapeHtml(item.name)}</a></div><div class="item-size">—</div></div>`;
                } else {
                    html += `<div class="item"><div class="item-icon">📁</div><div class="item-name"><a href="#" class="folder-link" data-path="${escapeAttr(item.path)}">${escapeHtml(item.name)}</a></div></div>`;
                }
            } else {
                const viewUrl = `/api/download?file=${encodeURIComponent(item.path)}`;
                const downloadUrl = `${viewUrl}&download=1`;
                const idx = imgIndex.get(item.path);
                if (currentView === 'list') {
                    if (item.isImage) {
                        html += `<div class="item"><div class="item-icon">🖼️</div><div class="item-name"><a href="${viewUrl}" class="image-link" data-image-index="${idx}">${escapeHtml(item.name)}</a> ${item.size ? `<small>(${item.size})</small>` : ''} <a href="${downloadUrl}" download title="Download">⬇️</a></div><div class="item-size"></div></div>`;
                    } else {
                        html += `<div class="item"><div class="item-icon">📄</div><div class="item-name"><a href="${downloadUrl}" download>${escapeHtml(item.name)}</a> ${item.size ? `<small>(${item.size})</small>` : ''}</div><div class="item-size"></div></div>`;
                    }
                } else {
                    if (item.isImage) {
                        const thumbUrl = `/api/thumbnail?file=${encodeURIComponent(item.path)}`;
                        html += `<div class="item"><a href="${viewUrl}" class="image-link" data-image-index="${idx}"><img class="thumbnail" src="${thumbUrl}" loading="lazy" alt="${escapeHtml(item.name)}"></a><div class="item-name"><a href="${viewUrl}" class="image-link" data-image-index="${idx}">${escapeHtml(item.name)}</a></div><div class="item-size">${item.size || ''} · <a href="${downloadUrl}" download>download</a></div></div>`;
                    } else {
                        html += `<div class="item"><div class="item-icon">📄</div><div class="item-name"><a href="${downloadUrl}" download>${escapeHtml(item.name)}</a></div><div class="item-size">${item.size || ''}</div></div>`;
                    }
                }
            }
        }
        container.innerHTML = html;

        document.querySelectorAll('.folder-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                fetchDirectory(link.getAttribute('data-path'));
            });
        });

        document.querySelectorAll('.image-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const i = parseInt(link.getAttribute('data-image-index'), 10);
                if (!isNaN(i)) openLightbox(i);
            });
        });
    }

    function renderBreadcrumb(currentRelative, baseDisplay) {
        const breadDiv = document.getElementById('breadcrumb');
        if (!currentRelative) {
            breadDiv.innerHTML = `<span>📁 ${escapeHtml(baseDisplay)}</span>`;
            return;
        }
        const parts = currentRelative.split('/').filter(p => p);
        let html = `<a href="#" data-bread-path="">${escapeHtml(baseDisplay)}</a>`;
        let accumulated = '';
        for (let i = 0; i < parts.length; i++) {
            accumulated += (accumulated ? '/' : '') + parts[i];
            if (i === parts.length - 1) {
                html += ` / <span>${escapeHtml(parts[i])}</span>`;
            } else {
                html += ` / <a href="#" data-bread-path="${escapeAttr(accumulated)}">${escapeHtml(parts[i])}</a>`;
            }
        }
        breadDiv.innerHTML = html;
        breadDiv.querySelectorAll('a[data-bread-path]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                fetchDirectory(link.getAttribute('data-bread-path'));
            });
        });
    }

    function showError(msg) {
        document.getElementById('fileList').innerHTML = `<div class="error">⚠️ ${escapeHtml(msg)}</div>`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function escapeAttr(str) {
        return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    /* ---------- Lightbox ---------- */
    const lb = {
        el: document.getElementById('lightbox'),
        img: document.getElementById('lbImg'),
        caption: document.getElementById('lbCaption'),
        prev: document.getElementById('lbPrev'),
        next: document.getElementById('lbNext'),
        close: document.getElementById('lbClose'),
        index: 0,
    };

    function openLightbox(i) {
        const imgs = window.galleryImages || [];
        if (!imgs.length) return;
        lb.index = Math.max(0, Math.min(i, imgs.length - 1));
        showLightboxImage();
        lb.el.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lb.el.classList.remove('open');
        lb.img.src = '';
        document.body.style.overflow = '';
    }

    function showLightboxImage() {
        const imgs = window.galleryImages || [];
        const item = imgs[lb.index];
        if (!item) return;
        lb.img.src = item.viewUrl;
        lb.img.alt = item.name;
        lb.caption.innerHTML = `${escapeHtml(item.name)} <span style="opacity:0.7">(${lb.index + 1}/${imgs.length})</span> <a href="${item.downloadUrl}" download>download</a>`;
        lb.prev.disabled = lb.index === 0;
        lb.next.disabled = lb.index === imgs.length - 1;
    }

    function lbStep(delta) {
        const imgs = window.galleryImages || [];
        const next = lb.index + delta;
        if (next < 0 || next >= imgs.length) return;
        lb.index = next;
        showLightboxImage();
    }

    lb.close.addEventListener('click', closeLightbox);
    lb.prev.addEventListener('click', () => lbStep(-1));
    lb.next.addEventListener('click', () => lbStep(1));
    // Click on the dark backdrop (but not the image or buttons) closes the lightbox.
    lb.el.addEventListener('click', (e) => {
        if (e.target === lb.el) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
        if (!lb.el.classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft') lbStep(-1);
        else if (e.key === 'ArrowRight') lbStep(1);
    });
    // Touch swipe support.
    let touchStartX = null;
    lb.el.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) touchStartX = e.touches[0].clientX;
    }, { passive: true });
    lb.el.addEventListener('touchend', (e) => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) lbStep(dx < 0 ? 1 : -1);
        touchStartX = null;
    });

    document.getElementById('listViewBtn').addEventListener('click', () => setView('list'));
    document.getElementById('galleryViewBtn').addEventListener('click', () => setView('gallery'));

    window.addEventListener('hashchange', () => {
        const newPath = decodeURIComponent(window.location.hash.substring(1) || '');
        if (newPath !== currentPath) fetchDirectory(newPath);
    });

    setView(currentView);
    fetchDirectory(currentPath);
</script>
</body>
</html>
