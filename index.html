<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery & File Browser</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🖼️ Gallery Browser</h1>
        <div class="view-toggle">
            <button id="listViewBtn" class="active">📋 List</button>
            <button id="galleryViewBtn">🖼️ Gallery</button>
        </div>
    </div>
    <div class="breadcrumb" id="breadcrumb">Loading...</div>
    <div class="file-list" id="fileList">
        <div class="empty">⏳ Loading...</div>
    </div>
    <footer>Click on image thumbnails to download full file</footer>
</div>
<script src="/script.js"></script>
</body>
</html>
