<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Browser · Go</title>
    <style>
        * {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        body {
            background: #f5f7fb;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .header {
            background: #1e2a3e;
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 500;
        }
        .view-toggle button {
            background: #334155;
            border: none;
            color: white;
            padding: 8px 16px;
            margin-left: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .view-toggle button.active {
            background: #3b82f6;
        }
        .breadcrumb {
            background: #f8fafc;
            padding: 12px 24px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
            word-break: break-all;
        }
        .breadcrumb a {
            color: #2563eb;
            text-decoration: none;
        }
        .toolbar {
            background: #f8fafc;
            padding: 10px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar-label {
            font-size: 0.85rem;
            color: #475569;
            margin-right: 4px;
        }
        .sort-btn {
            background: white;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.15s;
        }
        .sort-btn:hover { background: #f1f5f9; }
        .sort-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .file-list {
            padding: 20px;
        }
        /* List view */
        .list-view .item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #edf2f7;
        }
        .list-view .item-icon {
            width: 40px;
            font-size: 1.6rem;
            text-align: center;
        }
        .list-view .item-name {
            flex: 1;
            font-weight: 500;
        }
        .list-view .item-name a {
            text-decoration: none;
            color: #0f172a;
        }
        .list-view .item-size {
            color: #475569;
            font-size: 0.85rem;
            min-width: 80px;
            text-align: right;
        }
        /* Gallery view */
        .gallery-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .gallery-view .item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 0;
            text-align: center;
            transition: transform 0.1s, box-shadow 0.1s;
            overflow: hidden;
        }
        .gallery-view .item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .gallery-view .tile-link {
            display: block;
            padding: 12px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .gallery-view .thumbnail {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            background: #e2e8f0;
            margin-bottom: 8px;
            display: block;
        }
        .gallery-view .folder-icon {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            background: #e2e8f0;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .gallery-view .item-name {
            font-size: 0.85rem;
            word-break: break-word;
            color: #1e293b;
            font-weight: 500;
        }
        .gallery-view .item-meta {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }
        .gallery-view .item-meta .download-link {
            color: #2563eb;
            text-decoration: none;
        }
        .gallery-view .item-meta .download-link:hover { text-decoration: underline; }
        /* List view: also show date column */
        .list-view .item-date {
            color: #64748b;
            font-size: 0.8rem;
            min-width: 130px;
            text-align: right;
            margin-right: 8px;
        }
        .empty {
            text-align: center;
            padding: 48px;
            color: #64748b;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 12px;
        }
        footer {
            padding: 16px;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }
        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            user-select: none;
        }
        .lightbox.open { display: flex; }
        /* Stage: a black box that holds the image while it loads. The image is
           hidden until the full bytes arrive, so the user always sees a clean
           black frame instead of the previous picture or a torn partial render. */
        .lb-stage {
            position: relative;
            width: 92vw;
            height: 88vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 4px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .lightbox-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.15s ease-out;
        }
        .lightbox-img.loaded { opacity: 1; }
        .lb-progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background: rgba(255,255,255,0.08);
            opacity: 0;
            transition: opacity 0.2s;
            overflow: hidden;
        }
        .lb-progress.active { opacity: 1; }
        .lb-progress-bar {
            height: 100%;
            width: 35%;
            background: #3b82f6;
            position: relative;
        }
        @keyframes lb-progress-indeterminate {
            0%   { transform: translateX(-120%); }
            100% { transform: translateX(330%); }
        }
        .lb-error {
            position: absolute;
            color: #fca5a5;
            font-size: 0.95rem;
            text-align: center;
            padding: 16px;
        }
        .lightbox-caption {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: #e2e8f0;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 999px;
            max-width: 80vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lightbox-caption a {
            color: #93c5fd;
            text-decoration: none;
            margin-left: 10px;
        }
        .lightbox-caption a:hover { text-decoration: underline; }
        .lightbox-btn {
            position: absolute;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .lightbox-btn:hover { background: rgba(255,255,255,0.25); }
        .lightbox-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }
        .lightbox-close { top: 20px; right: 20px; }
        .lightbox-prev { left: 20px; top: 50%; transform: translateY(-50%); }
        .lightbox-next { right: 20px; top: 50%; transform: translateY(-50%); }
        @media (max-width: 600px) {
            .lightbox-prev { left: 8px; }
            .lightbox-next { right: 8px; }
        }
        /* Comment badge on tiles */
        .comment-badge {
            display: inline-block;
            background: #3b82f6;
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 6px;
            vertical-align: middle;
        }
        .gallery-view .badge-overlay {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 999px;
            pointer-events: none;
        }
        .gallery-view .item { position: relative; }
        /* Comments panel inside lightbox */
        .comments-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: min(380px, 90vw);
            height: 100%;
            background: #1e293b;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.25s ease;
            z-index: 10;
        }
        .comments-panel.open { transform: translateX(0); }
        .comments-panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .comments-list .empty-comments {
            color: #94a3b8;
            text-align: center;
            padding: 24px 0;
            font-size: 0.9rem;
        }
        .comment {
            background: #334155;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .comment-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-bottom: 4px;
        }
        .comment-meta .author { font-weight: 600; color: #93c5fd; }
        .comment-body {
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .comment-delete {
            background: none;
            border: none;
            color: #fca5a5;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 0;
            margin-top: 4px;
        }
        .comment-delete:hover { text-decoration: underline; }
        .comment-form {
            padding: 12px 20px 16px;
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .comment-form textarea {
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
            max-height: 160px;
        }
        .comment-form textarea:focus { outline: none; border-color: #3b82f6; }
        .comment-form button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            align-self: flex-end;
        }
        .comment-form button:hover { background: #2563eb; }
        .comment-form button:disabled { opacity: 0.5; cursor: not-allowed; }
        .lightbox-comments-toggle {
            position: absolute;
            top: 20px;
            right: 80px;
        }
        .lightbox-comments-toggle .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ef4444;
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 999px;
            min-width: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🖼️ Gallery Browser</h1>
        <div class="view-toggle">
            <button id="listViewBtn" class="active">📋 List</button>
            <button id="galleryViewBtn">🖼️ Gallery</button>
        </div>
    </div>
    <div class="breadcrumb" id="breadcrumb">Loading...</div>
    <div class="toolbar">
        <span class="toolbar-label">Sort:</span>
        <button class="sort-btn" data-sort="name">Name</button>
        <button class="sort-btn" data-sort="date">Date</button>
        <button class="sort-btn" data-sort="size">Size</button>
    </div>
    <div class="file-list list-view" id="fileList">
        <div class="empty">⏳ Loading...</div>
    </div>
    <footer>Click a tile to open · 💬 to comment · ⬇ to download · use ←/→ keys in lightbox, C to toggle comments</footer>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
    <button class="lightbox-btn lightbox-close" id="lbClose" aria-label="Close (Esc)">✕</button>
    <button class="lightbox-btn lightbox-prev" id="lbPrev" aria-label="Previous (←)">‹</button>
    <button class="lightbox-btn lightbox-next" id="lbNext" aria-label="Next (→)">›</button>
    <button class="lightbox-btn lightbox-comments-toggle" id="lbCommentsBtn" aria-label="Comments (C)">💬<span class="badge" id="lbCommentsBadge" style="display:none">0</span></button>
    <div class="lb-stage" id="lbStage">
        <img class="lightbox-img" id="lbImg" alt="">
        <div class="lb-progress" id="lbProgress" aria-hidden="true"><div class="lb-progress-bar" id="lbProgressBar"></div></div>
        <div class="lb-error" id="lbError" style="display:none"></div>
    </div>
    <div class="lightbox-caption" id="lbCaption"></div>

    <aside class="comments-panel" id="commentsPanel" aria-label="Comments">
        <div class="comments-panel-header">
            <span>Comments</span>
            <button class="lightbox-btn" id="commentsClose" aria-label="Close panel" style="position:static;width:32px;height:32px;font-size:1rem">✕</button>
        </div>
        <div class="comments-list" id="commentsList"></div>
        <div class="comment-form">
            <textarea id="commentInput" placeholder="Write a comment…" maxlength="4000"></textarea>
            <button id="commentSubmit">Post</button>
        </div>
    </aside>
</div>

<script>
    let currentPath = decodeURIComponent(window.location.hash.substring(1) || '');
    let currentView = localStorage.getItem('galleryView') === 'gallery' ? 'gallery' : 'list';
    // Sort state. Stored as "field:direction" e.g. "name:asc" or "date:desc".
    let currentSort = localStorage.getItem('gallerySort') || 'name:asc';

    function getSort() {
        const [field, dir] = currentSort.split(':');
        return { field: field || 'name', dir: dir === 'desc' ? 'desc' : 'asc' };
    }

    function setSort(field) {
        const cur = getSort();
        // Click the active field to toggle direction; otherwise switch field
        // and use a sensible default direction (newest first for date,
        // largest first for size, A→Z for name).
        let dir;
        if (cur.field === field) {
            dir = cur.dir === 'asc' ? 'desc' : 'asc';
        } else {
            dir = field === 'name' ? 'asc' : 'desc';
        }
        currentSort = `${field}:${dir}`;
        localStorage.setItem('gallerySort', currentSort);
        updateSortButtons();
        if (window.lastContents) renderFileList(window.lastContents, window.lastCurrentDir);
    }

    function updateSortButtons() {
        const { field, dir } = getSort();
        document.querySelectorAll('.sort-btn').forEach(btn => {
            const f = btn.getAttribute('data-sort');
            const active = f === field;
            btn.classList.toggle('active', active);
            // Strip any trailing arrow then add the current one if active.
            const base = btn.textContent.replace(/\s*[▲▼]\s*$/, '');
            btn.textContent = active ? `${base} ${dir === 'asc' ? '▲' : '▼'}` : base;
        });
    }

    function sortContents(items) {
        const { field, dir } = getSort();
        const mult = dir === 'asc' ? 1 : -1;
        const cmp = (a, b) => {
            // Folders always come before files regardless of sort.
            if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
            let av, bv;
            if (field === 'date') {
                av = a.modTimeUnix || 0; bv = b.modTimeUnix || 0;
                if (av === bv) return a.name.localeCompare(b.name);
                return (av - bv) * mult;
            }
            if (field === 'size') {
                // Folders all share size 0 — fall back to name.
                if (a.type === 'dir') return a.name.localeCompare(b.name);
                av = a.sizeBytes || 0; bv = b.sizeBytes || 0;
                if (av === bv) return a.name.localeCompare(b.name);
                return (av - bv) * mult;
            }
            // name (default)
            return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }) * mult;
        };
        return [...items].sort(cmp);
    }

    function setView(view) {
        currentView = view;
        localStorage.setItem('galleryView', view);
        document.getElementById('listViewBtn').classList.toggle('active', view === 'list');
        document.getElementById('galleryViewBtn').classList.toggle('active', view === 'gallery');
        const container = document.getElementById('fileList');
        container.classList.remove('list-view', 'gallery-view');
        container.classList.add(view === 'list' ? 'list-view' : 'gallery-view');
        if (window.lastContents) renderFileList(window.lastContents, window.lastCurrentDir);
    }

    async function fetchDirectory(path) {
        try {
            const params = new URLSearchParams({ dir: path });
            const resp = await fetch(`/api/list?${params}`);
            const data = await resp.json();
            if (data.error) throw new Error(data.error);
            window.lastContents = data.contents || [];
            window.lastCurrentDir = data.currentDir;
            renderFileList(data.contents || [], data.currentDir);
            renderBreadcrumb(data.currentDir, data.basePathForDisplay);
            window.location.hash = encodeURIComponent(path);
            currentPath = path;
        } catch (err) {
            showError(err.message);
        }
    }

    function renderFileList(contents, currentDir) {
        const container = document.getElementById('fileList');
        // Server returns null for some empty folders; coerce to [] so .length works.
        contents = contents || [];
        if (!contents.length) {
            container.innerHTML = '<div class="empty">📭 This folder is empty</div>';
            window.galleryImages = [];
            return;
        }

        // Apply current sort (client-side, no extra fetch).
        const sorted = sortContents(contents);

        // Build a flat list of images in the *displayed* order so the lightbox
        // navigates the same way the user sees them.
        const images = sorted
            .filter(it => it.type === 'file' && it.isImage)
            .map(it => ({
                name: it.name,
                path: it.path,
                // /api/preview transparently transcodes HEIC to JPEG for
                // browsers that don't support it natively, and streams other
                // image formats unchanged. Always use it for the lightbox.
                viewUrl: `/api/preview?file=${encodeURIComponent(it.path)}`,
                downloadUrl: `/api/download?file=${encodeURIComponent(it.path)}&download=1`,
            }));
        window.galleryImages = images;
        const imgIndex = new Map(images.map((img, i) => [img.path, i]));

        let html = '';
        if (currentDir !== '') {
            const parentPath = currentDir.substring(0, currentDir.lastIndexOf('/'));
            if (currentView === 'list') {
                html += `<div class="item"><div class="item-icon">📁</div><div class="item-name"><a href="#" class="folder-link" data-path="${escapeAttr(parentPath)}">..</a></div><div class="item-date"></div><div class="item-size">—</div></div>`;
            } else {
                html += `<div class="item"><a href="#" class="tile-link folder-link" data-path="${escapeAttr(parentPath)}"><div class="folder-icon">📁</div><div class="item-name">..</div></a></div>`;
            }
        }

        // Returns the HTML for an inline (list-view) badge or empty string when none.
        const inlineBadge = (item) => item.commentCount > 0
            ? ` <a href="#" class="comment-badge comment-badge-link" data-path="${escapeAttr(item.path)}" data-name="${escapeAttr(item.name)}" title="View comments">💬 ${item.commentCount}</a>`
            : '';
        // Returns the absolute-positioned overlay badge for gallery tiles.
        const overlayBadge = (item) => item.commentCount > 0
            ? `<a href="#" class="badge-overlay comment-badge-link" data-path="${escapeAttr(item.path)}" data-name="${escapeAttr(item.name)}" title="View comments" style="pointer-events:auto;text-decoration:none;color:white">💬 ${item.commentCount}</a>`
            : '';

        for (const item of sorted) {
            if (item.type === 'dir') {
                if (currentView === 'list') {
                    html += `<div class="item"><div class="item-icon">📁</div><div class="item-name"><a href="#" class="folder-link" data-path="${escapeAttr(item.path)}">${escapeHtml(item.name)}</a>${inlineBadge(item)}</div><div class="item-date">${escapeHtml(item.modTime || '')}</div><div class="item-size">—</div></div>`;
                } else {
                    html += `<div class="item">${overlayBadge(item)}<a href="#" class="tile-link folder-link" data-path="${escapeAttr(item.path)}"><div class="folder-icon">📁</div><div class="item-name">${escapeHtml(item.name)}</div><div class="item-meta"><span>${escapeHtml(item.modTime || '')}</span></div></a></div>`;
                }
            } else {
                const viewUrl = `/api/download?file=${encodeURIComponent(item.path)}`;
                const downloadUrl = `${viewUrl}&download=1`;
                const idx = imgIndex.get(item.path);
                if (currentView === 'list') {
                    if (item.isImage) {
                        html += `<div class="item"><div class="item-icon">🖼️</div><div class="item-name"><a href="${viewUrl}" class="image-link" data-image-index="${idx}">${escapeHtml(item.name)}</a> <a href="${downloadUrl}" download title="Download">⬇️</a>${inlineBadge(item)}</div><div class="item-date">${escapeHtml(item.modTime || '')}</div><div class="item-size">${escapeHtml(item.size || '')}</div></div>`;
                    } else {
                        html += `<div class="item"><div class="item-icon">📄</div><div class="item-name"><a href="${downloadUrl}" download>${escapeHtml(item.name)}</a>${inlineBadge(item)}</div><div class="item-date">${escapeHtml(item.modTime || '')}</div><div class="item-size">${escapeHtml(item.size || '')}</div></div>`;
                    }
                } else {
                    if (item.isImage) {
                        const thumbUrl = `/api/thumbnail?file=${encodeURIComponent(item.path)}`;
                        html += `<div class="item">
                            ${overlayBadge(item)}
                            <a href="${viewUrl}" class="tile-link image-link" data-image-index="${idx}">
                                <img class="thumbnail" src="${thumbUrl}" loading="lazy" alt="${escapeHtml(item.name)}">
                                <div class="item-name">${escapeHtml(item.name)}</div>
                                <div class="item-meta"><span>${escapeHtml(item.modTime || '')}</span><span>${escapeHtml(item.size || '')}</span></div>
                            </a>
                            <div class="item-meta" style="padding: 0 12px 10px;">
                                <a class="download-link" href="${downloadUrl}" download onclick="event.stopPropagation()">⬇ download</a>
                                <a class="download-link comment-badge-link" href="#" data-path="${escapeAttr(item.path)}" data-name="${escapeAttr(item.name)}">💬 comment</a>
                            </div>
                        </div>`;
                    } else {
                        html += `<div class="item">
                            ${overlayBadge(item)}
                            <a href="${downloadUrl}" class="tile-link" download>
                                <div class="folder-icon">📄</div>
                                <div class="item-name">${escapeHtml(item.name)}</div>
                                <div class="item-meta"><span>${escapeHtml(item.modTime || '')}</span><span>${escapeHtml(item.size || '')}</span></div>
                            </a>
                            <div class="item-meta" style="padding: 0 12px 10px;">
                                <a class="download-link comment-badge-link" href="#" data-path="${escapeAttr(item.path)}" data-name="${escapeAttr(item.name)}">💬 comment</a>
                            </div>
                        </div>`;
                    }
                }
            }
        }
        container.innerHTML = html;

        document.querySelectorAll('.folder-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                fetchDirectory(link.getAttribute('data-path'));
            });
        });

        document.querySelectorAll('.image-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const i = parseInt(link.getAttribute('data-image-index'), 10);
                if (!isNaN(i)) openLightbox(i);
            });
        });

        // Comment badges open the comments dialog standalone (not the lightbox).
        document.querySelectorAll('.comment-badge-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                openCommentsStandalone(
                    link.getAttribute('data-path'),
                    link.getAttribute('data-name'),
                );
            });
        });
    }

    function renderBreadcrumb(currentRelative, baseDisplay) {
        const breadDiv = document.getElementById('breadcrumb');
        if (!currentRelative) {
            breadDiv.innerHTML = `<span>📁 ${escapeHtml(baseDisplay)}</span>`;
            return;
        }
        const parts = currentRelative.split('/').filter(p => p);
        let html = `<a href="#" data-bread-path="">${escapeHtml(baseDisplay)}</a>`;
        let accumulated = '';
        for (let i = 0; i < parts.length; i++) {
            accumulated += (accumulated ? '/' : '') + parts[i];
            if (i === parts.length - 1) {
                html += ` / <span>${escapeHtml(parts[i])}</span>`;
            } else {
                html += ` / <a href="#" data-bread-path="${escapeAttr(accumulated)}">${escapeHtml(parts[i])}</a>`;
            }
        }
        breadDiv.innerHTML = html;
        breadDiv.querySelectorAll('a[data-bread-path]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                fetchDirectory(link.getAttribute('data-bread-path'));
            });
        });
    }

    function showError(msg) {
        document.getElementById('fileList').innerHTML = `<div class="error">⚠️ ${escapeHtml(msg)}</div>`;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    function escapeAttr(str) {
        return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    /* ---------- Lightbox ---------- */
    const lb = {
        el: document.getElementById('lightbox'),
        img: document.getElementById('lbImg'),
        caption: document.getElementById('lbCaption'),
        prev: document.getElementById('lbPrev'),
        next: document.getElementById('lbNext'),
        close: document.getElementById('lbClose'),
        progress: document.getElementById('lbProgress'),
        progressBar: document.getElementById('lbProgressBar'),
        errorEl: document.getElementById('lbError'),
        index: 0,
        // Bumped every navigation so stale onload callbacks can be ignored.
        loadGen: 0,
    };

    function openLightbox(i) {
        const imgs = window.galleryImages || [];
        if (!imgs.length) return;
        lb.index = Math.max(0, Math.min(i, imgs.length - 1));
        showLightboxImage();
        lb.el.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        if (comments) comments.closePanel();
        lb.el.classList.remove('open');
        clearImage();
        document.body.style.overflow = '';
    }

    function clearImage() {
        // Hide the previous image so the user sees only the black stage while
        // the next one downloads. removeAttribute('src') is what actually drops
        // the rendered pixels — setting src='' would fire a load event for an
        // empty URL in some browsers.
        lb.img.classList.remove('loaded');
        lb.img.removeAttribute('src');
        lb.errorEl.style.display = 'none';
        lb.progress.classList.remove('active');
    }

    function loadCurrentImage(item) {
        const myGen = ++lb.loadGen;
        clearImage();

        // Show an indeterminate progress bar while the browser fetches & decodes.
        // The browser already paints JPEGs progressively as bytes arrive, so once
        // the <img> becomes visible (on `load`) we're done.
        lb.progress.classList.add('active');
        lb.progressBar.style.animation = 'lb-progress-indeterminate 1.4s linear infinite';

        const onLoad = () => {
            if (myGen !== lb.loadGen) return; // user navigated away
            lb.img.classList.add('loaded');
            lb.progress.classList.remove('active');
            lb.progressBar.style.animation = '';
        };
        const onError = async () => {
            if (myGen !== lb.loadGen) return;
            // <img> error events don't tell us why. Re-fetch HEAD/GET to grab
            // the server's actual message (e.g. "Unsupported image format").
            let msg = 'Failed to load image';
            try {
                const resp = await fetch(item.viewUrl, { credentials: 'same-origin' });
                if (myGen !== lb.loadGen) return;
                if (!resp.ok) {
                    const text = (await resp.text()).trim();
                    msg = `${resp.status} ${resp.statusText}${text ? ' — ' + text.split('\n')[0].slice(0, 200) : ''}`;
                }
            } catch (_) { /* network really is down; keep generic message */ }
            if (myGen !== lb.loadGen) return;
            showImageError(msg);
        };

        lb.img.onload = onLoad;
        lb.img.onerror = onError;
        lb.img.src = item.viewUrl;
    }

    function showImageError(msg) {
        lb.progress.classList.remove('active');
        lb.progressBar.style.animation = '';
        lb.errorEl.textContent = '⚠️ ' + msg;
        lb.errorEl.style.display = 'block';
    }

    function showLightboxImage() {
        const imgs = window.galleryImages || [];
        const item = imgs[lb.index];
        if (!item) return;
        lb.img.alt = item.name;
        lb.caption.innerHTML = `${escapeHtml(item.name)} <span style="opacity:0.7">(${lb.index + 1}/${imgs.length})</span> <a href="${item.downloadUrl}" download title="Download full-size original">⬇ original</a>`;
        lb.prev.disabled = lb.index === 0;
        lb.next.disabled = lb.index === imgs.length - 1;
        // Kick off a streamed load. Bytes paint as they arrive; until decode
        // completes the user sees a black frame, never the previous image.
        loadCurrentImage(item);
        // Bind the comments panel to this image. It only fetches when actually visible.
        comments.bindTo(item.path, item.name);
    }

    function lbStep(delta) {
        const imgs = window.galleryImages || [];
        const next = lb.index + delta;
        if (next < 0 || next >= imgs.length) return;
        lb.index = next;
        showLightboxImage();
    }

    lb.close.addEventListener('click', closeLightbox);
    lb.prev.addEventListener('click', () => lbStep(-1));
    lb.next.addEventListener('click', () => lbStep(1));
    // Click on the dark backdrop (but not the image or buttons) closes the lightbox.
    lb.el.addEventListener('click', (e) => {
        if (e.target === lb.el) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
        if (!lb.el.classList.contains('open')) return;
        // If the user is typing in the comment box, ignore navigation/close keys.
        if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft') lbStep(-1);
        else if (e.key === 'ArrowRight') lbStep(1);
        else if (e.key === 'c' || e.key === 'C') comments.togglePanel();
    });
    // Touch swipe support.
    let touchStartX = null;
    lb.el.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) touchStartX = e.touches[0].clientX;
    }, { passive: true });
    lb.el.addEventListener('touchend', (e) => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) lbStep(dx < 0 ? 1 : -1);
        touchStartX = null;
    });

    /* ---------- Comments ---------- */
    let comments;
    comments = (() => {
        const panel = document.getElementById('commentsPanel');
        const list = document.getElementById('commentsList');
        const input = document.getElementById('commentInput');
        const submit = document.getElementById('commentSubmit');
        const closeBtn = document.getElementById('commentsClose');
        const toggleBtn = document.getElementById('lbCommentsBtn');
        const badge = document.getElementById('lbCommentsBadge');
        // Track what we're currently commenting on. May be null when nothing's open.
        let current = { path: null, name: null };
        // Standalone mode = lightbox-less; we open the panel as a centered modal.
        let standalone = false;

        function setBadge(n) {
            if (n > 0) {
                badge.textContent = n;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }

        async function load() {
            if (!current.path) return;
            list.innerHTML = '<div class="empty-comments">Loading…</div>';
            try {
                const resp = await fetch(`/api/comments?file=${encodeURIComponent(current.path)}`);
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                render(data.comments || []);
                setBadge((data.comments || []).length);
            } catch (err) {
                list.innerHTML = `<div class="empty-comments">⚠️ ${escapeHtml(err.message)}</div>`;
            }
        }

        function render(items) {
            if (!items.length) {
                list.innerHTML = '<div class="empty-comments">No comments yet. Be the first.</div>';
                return;
            }
            list.innerHTML = items.map(c => `
                <div class="comment" data-id="${c.id}">
                    <div class="comment-meta">
                        <span class="author">${escapeHtml(c.author)}</span>
                        <span>${formatTime(c.createdAt)}</span>
                    </div>
                    <div class="comment-body">${escapeHtml(c.body)}</div>
                    ${c.mine ? `<button class="comment-delete" data-id="${c.id}">Delete</button>` : ''}
                </div>
            `).join('');
            list.querySelectorAll('.comment-delete').forEach(btn => {
                btn.addEventListener('click', () => del(btn.getAttribute('data-id')));
            });
            // Auto-scroll to bottom so newest comment is visible.
            list.scrollTop = list.scrollHeight;
        }

        async function post() {
            const body = input.value.trim();
            if (!body || !current.path) return;
            submit.disabled = true;
            try {
                const resp = await fetch('/api/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file: current.path, body }),
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                input.value = '';
                await load();
                bumpListingBadge(current.path, +1);
            } catch (err) {
                alert('Failed to post comment: ' + err.message);
            } finally {
                submit.disabled = false;
            }
        }

        async function del(id) {
            if (!confirm('Delete this comment?')) return;
            try {
                const resp = await fetch(`/api/comments?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
                const data = await resp.json();
                if (data.error) throw new Error(data.error);
                await load();
                bumpListingBadge(current.path, -1);
            } catch (err) {
                alert('Failed to delete: ' + err.message);
            }
        }

        // Keep the in-page tile badges in sync without refetching the listing.
        function bumpListingBadge(path, delta) {
            if (!window.lastContents) return;
            const item = window.lastContents.find(it => it.path === path);
            if (!item) return;
            item.commentCount = Math.max(0, (item.commentCount || 0) + delta);
            renderFileList(window.lastContents, window.lastCurrentDir);
        }

        function bindTo(path, name) {
            current = { path, name };
            // Reset; load() runs whenever the panel is open or the user opens it.
            list.innerHTML = '<div class="empty-comments">…</div>';
            input.value = '';
            // If the panel is already open inside the lightbox, refresh now.
            if (panel.classList.contains('open')) load();
            else load(); // also fetch so the badge count is correct even when closed
        }

        function openPanel() {
            panel.classList.add('open');
            // load() may already have run via bindTo, but call again to ensure
            // the list is fresh when re-opening on the same image.
            if (current.path) load();
        }

        function closePanel() {
            panel.classList.remove('open');
            if (standalone) {
                // Take down the lightbox shell we borrowed for the standalone case.
                lb.el.classList.remove('open');
                document.body.style.overflow = '';
                // Restore lightbox's normal image-mode UI.
                lb.img.style.display = '';
                lb.prev.style.display = '';
                lb.next.style.display = '';
                toggleBtn.style.display = '';
                lb.caption.style.display = '';
                standalone = false;
            }
        }

        function togglePanel() {
            if (panel.classList.contains('open')) closePanel();
            else openPanel();
        }

        // Open the comments panel without any image — used by the comment badges
        // on tiles (folders, non-image files, or images without opening lightbox).
        function openStandalone(path, name) {
            standalone = true;
            // Reuse the lightbox shell so we get the dark backdrop & escape-to-close.
            lb.el.classList.add('open');
            document.body.style.overflow = 'hidden';
            // Hide the image-mode bits.
            lb.img.style.display = 'none';
            lb.prev.style.display = 'none';
            lb.next.style.display = 'none';
            toggleBtn.style.display = 'none';
            lb.caption.style.display = 'none';
            bindTo(path, name);
            openPanel();
        }

        toggleBtn.addEventListener('click', togglePanel);
        closeBtn.addEventListener('click', closePanel);
        submit.addEventListener('click', post);
        // Cmd/Ctrl+Enter posts the comment.
        input.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();
                post();
            }
        });

        return { bindTo, openPanel, closePanel, togglePanel, openStandalone };
    })();

    function openCommentsStandalone(path, name) {
        comments.openStandalone(path, name);
    }

    function formatTime(unix) {
        if (!unix) return '';
        const d = new Date(unix * 1000);
        const now = new Date();
        const sameDay = d.toDateString() === now.toDateString();
        if (sameDay) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return d.toLocaleString([], { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    document.getElementById('listViewBtn').addEventListener('click', () => setView('list'));
    document.getElementById('galleryViewBtn').addEventListener('click', () => setView('gallery'));

    document.querySelectorAll('.sort-btn').forEach(btn => {
        btn.addEventListener('click', () => setSort(btn.getAttribute('data-sort')));
    });

    window.addEventListener('hashchange', () => {
        const newPath = decodeURIComponent(window.location.hash.substring(1) || '');
        if (newPath !== currentPath) fetchDirectory(newPath);
    });

    updateSortButtons();
    setView(currentView);
    fetchDirectory(currentPath);
</script>
</body>
</html>
