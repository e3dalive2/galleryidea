<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory Browser · Go Edition</title>
    <style>
        * {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f5f7fb;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .header {
            background: #1e2a3e;
            color: white;
            padding: 20px 24px;
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 500;
        }
        .breadcrumb {
            background: #f8fafc;
            padding: 12px 24px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
            word-break: break-all;
        }
        .breadcrumb a {
            color: #2563eb;
            text-decoration: none;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        .file-list {
            padding: 12px 0;
        }
        .item {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            border-bottom: 1px solid #edf2f7;
            transition: background 0.1s;
        }
        .item:hover {
            background: #f1f5f9;
        }
        .item-icon {
            width: 32px;
            font-size: 1.4rem;
            margin-right: 16px;
            text-align: center;
        }
        .item-name {
            flex: 1;
            font-weight: 500;
        }
        .item-name a {
            text-decoration: none;
            color: #0f172a;
        }
        .item-name a.folder-link {
            font-weight: 600;
            color: #1e293b;
        }
        .item-name a.file-link {
            color: #334155;
        }
        .item-name small {
            font-size: 0.75rem;
            color: #64748b;
            margin-left: 12px;
            font-weight: normal;
        }
        .item-size {
            color: #475569;
            font-size: 0.85rem;
            min-width: 80px;
            text-align: right;
        }
        .empty {
            padding: 48px;
            text-align: center;
            color: #64748b;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px 24px;
            margin: 16px;
            border-radius: 12px;
        }
        footer {
            padding: 16px 24px;
            font-size: 0.75rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📂 Remote Directory Browser · Go</h1>
    </div>
    <div class="breadcrumb" id="breadcrumb">
        Loading...
    </div>
    <div class="file-list" id="fileList">
        <div class="empty">⏳ Fetching directory contents...</div>
    </div>
    <footer>
        Single‑binary Go backend • No dependencies • Fast & secure
    </footer>
</div>

<script>
    // Get current path from URL hash or default to empty (root of basePath)
    let currentPath = decodeURIComponent(window.location.hash.substring(1) || '');

    function fetchDirectory(path) {
        const params = new URLSearchParams();
        params.append('dir', path);
        fetch(`/api/list?${params.toString()}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showError(data.error);
                    return;
                }
                renderFileList(data.contents, data.currentDir);
                renderBreadcrumb(data.currentDir, data.basePathForDisplay);
                // Update URL hash without reloading
                window.location.hash = encodeURIComponent(path);
                currentPath = path;
            })
            .catch(err => {
                showError('Network error: ' + err.message);
            });
    }

    function showError(msg) {
        const container = document.getElementById('fileList');
        container.innerHTML = `<div class="error">⚠️ ${escapeHtml(msg)}</div>`;
    }

    function renderFileList(contents, currentDir) {
        const container = document.getElementById('fileList');
        if (!contents.length) {
            container.innerHTML = '<div class="empty">📭 This folder is empty</div>';
            return;
        }

        let html = '';
        // Always show "Parent Directory" if not at root (root relative to basePath)
        if (currentDir !== '') {
            const parentPath = currentDir.substring(0, currentDir.lastIndexOf('/'));
            html += `
                <div class="item">
                    <div class="item-icon">📁</div>
                    <div class="item-name">
                        <a href="#" class="folder-link" data-path="${escapeAttr(parentPath)}">..</a>
                    </div>
                    <div class="item-size">—</div>
                </div>
            `;
        }

        for (const item of contents) {
            const icon = item.type === 'dir' ? '📁' : '📄';
            const displayName = item.name;
            const clickablePath = item.type === 'dir' ? item.path : '';

            if (item.type === 'dir') {
                html += `
                    <div class="item">
                        <div class="item-icon">${icon}</div>
                        <div class="item-name">
                            <a href="#" class="folder-link" data-path="${escapeAttr(item.path)}">${escapeHtml(displayName)}</a>
                        </div>
                        <div class="item-size">—</div>
                    </div>
                `;
            } else {
                // For files: direct download link using /api/download
                const downloadUrl = `/api/download?file=${encodeURIComponent(item.path)}`;
                html += `
                    <div class="item">
                        <div class="item-icon">${icon}</div>
                        <div class="item-name">
                            <a href="${escapeAttr(downloadUrl)}" class="file-link" download>${escapeHtml(displayName)}</a>
                            ${item.size ? `<small>(${item.size})</small>` : ''}
                        </div>
                        <div class="item-size"></div>
                    </div>
                `;
            }
        }
        container.innerHTML = html;

        // Attach click handlers for folders
        document.querySelectorAll('.folder-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const targetPath = link.getAttribute('data-path');
                if (targetPath !== undefined) {
                    fetchDirectory(targetPath);
                }
            });
        });
    }

    function renderBreadcrumb(currentRelative, baseDisplay) {
        const breadDiv = document.getElementById('breadcrumb');
        if (!currentRelative) {
            breadDiv.innerHTML = `<span>📁 ${escapeHtml(baseDisplay)}</span>`;
            return;
        }
        const parts = currentRelative.split('/').filter(p => p);
        let breadHtml = `<a href="#" data-bread-path="">${escapeHtml(baseDisplay)}</a>`;
        let accumulated = '';
        for (let i = 0; i < parts.length; i++) {
            accumulated += (accumulated ? '/' : '') + parts[i];
            const isLast = i === parts.length - 1;
            if (isLast) {
                breadHtml += ` / <span>${escapeHtml(parts[i])}</span>`;
            } else {
                breadHtml += ` / <a href="#" data-bread-path="${escapeAttr(accumulated)}">${escapeHtml(parts[i])}</a>`;
            }
        }
        breadDiv.innerHTML = breadHtml;
        // Attach breadcrumb clicks
        breadDiv.querySelectorAll('a[data-bread-path]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const path = link.getAttribute('data-bread-path');
                fetchDirectory(path);
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function escapeAttr(str) {
        return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Initial load: read from hash or start at root
    fetchDirectory(currentPath);

    // Listen to hash changes (back/forward buttons)
    window.addEventListener('hashchange', () => {
        const newPath = decodeURIComponent(window.location.hash.substring(1) || '');
        if (newPath !== currentPath) {
            fetchDirectory(newPath);
        }
    });
</script>
</body>
</html>
